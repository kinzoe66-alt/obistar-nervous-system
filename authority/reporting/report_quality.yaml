kind: reporting_contract
name: governed_report_quality
version: 1

required_sections:
  - summary
  - affected_surface
  - evidence
  - replayability
  - impact
  - remediation
  - manual_review_status

admissibility:
  replay_required: true
  evidence_bundle_required: true
  confidence_threshold: 0.85
  manual_review_required: true

explanation:
  style: simplified
  avoid_jargon: true
  max_summary_sentences: 3
  require_plain_language_impact: true

blocked_behavior:
  - unsupported_claims
  - autonomous_submission
  - unverifiable_impact
