kind: confidence_contract
name: governed_confidence_model
version: 1

weights:
  replay_stability: 0.25
  evidence_quality: 0.20
  report_quality: 0.15
  remediation_quality: 0.10
  outcome_learning: 0.15
  deduplication_uniqueness: 0.15

thresholds:
  high_confidence: 0.85
  moderate_confidence: 0.60
  low_confidence: 0.59

manual_review:
  required: true

blocked_behavior:
  - confirmed_vulnerability_claim
  - autonomous_submission
